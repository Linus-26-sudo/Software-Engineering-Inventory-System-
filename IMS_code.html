.pf{background:#12263a;color:#b9c7d4;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 28px;margin-top:28px;font-size:14px}.pf a{color:#7fdcdc;cursor:pointer}.pf .b2{display:flex;align-items:center;gap:10px;color:#fff}
@media(max-width:760px){.ph{padding:40px 20px}.ph h1{font-size:30px}}

.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.fc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 1px 3px rgba(16,32,48,.07)}

<body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,9);
let mem={};
const store={
 get(k,d){try{const v=localStorage.getItem('ims2_'+k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},
 set(k,v){mem[k]=v;try{localStorage.setItem('ims2_'+k,JSON.stringify(v))}catch(e){}}
};
try{Object.keys(localStorage).filter(k=>k.startsWith('ims_')).forEach(k=>localStorage.removeItem(k))}catch(e){}
try{if(!localStorage.getItem('ims2_acc_reset1')){localStorage.removeItem('ims2_users');localStorage.removeItem('ims2_session');localStorage.setItem('ims2_acc_reset1','1')}}catch(e){}
let D={items:store.get('items',[]),sups:store.get('sups',[]),txs:store.get('txs',[]),users:store.get('users',[]),company:store.get('company',{name:'',logo:'',description:'',mission:'',services:'',address:'',phone:'',email:'',hours:''})};
let me=store.get('session',null);
const save=()=>{for(const k in D)store.set(k,D[k])};
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(p)}}
const stock=id=>D.txs.filter(t=>t.itemId===id).reduce((s,t)=>s+(t.type==='in'?t.qty:-t.qty),0);
const status=i=>{const q=stock(i.id);return q<=0?['zero','Out of stock']:q<=i.min?['low','Low stock']:['ok','In stock']};
const item=id=>D.items.find(i=>i.id===id);
const sup=id=>D.sups.find(s=>s.id===id);
let page='dashboard',authMode='profile';
const ic={dashboard:'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',items:'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',stock:'M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3',sales:'M3 17l6-6 4 4 8-8M15 7h6v6',damaged:'M12 3l10 18H2zM12 10v5M12 18v.5',suppliers:'M3 21V8l9-5 9 5v13M9 21v-6h6v6',reports:'M6 3h9l4 4v14H6zM9 12h7M9 16h7',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',company:'M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6',account:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8'};
const lowN=()=>D.items.filter(i=>status(i)[0]!=='ok').length;
function bars(){const l=[...D.items].sort((a,b)=>stock(b.id)-stock(a.id)).slice(0,8),m=Math.max(1,...l.map(i=>stock(i.id)));return l.length?`<div class="bars">${l.map(i=>`<div class="row"><span>${esc(i.name)}</span><div class="tr"><i class="${status(i)[0]}" style="width:${Math.max(0,stock(i.id))/m*100}%"></i></div><b>${stock(i.id)}</b></div>`).join('')}</div>`:'<div class="empty">Add items to see stock levels.</div>'}

function render(){
 if(!me){return authMode==='profile'?renderProfile():renderAuth()}
 const pages={dashboard:['Dashboard',vDash],items:['Items',vItems],stock:['Stock in / out',vStock],sales:['Sales',vSales],damaged:['Damaged stock',vDamaged],suppliers:['Suppliers',vSups],reports:['Reports',vReports],users:['User management',vUsers],company:['Company profile',vCompany],account:['My account',vAccount]};
 if(me.role!=='admin'){delete pages.company;delete pages.users}
 if(!pages[page])page='dashboard';
 $('#root').innerHTML=`<div class="app"><nav><div class="brand">${logoHtml()}<span>${esc(D.company.name||'Inventory System')}</span></div>
 ${Object.entries(pages).map(([k,v])=>`<a data-p="${k}" class="${k===page?'on':''}" tabindex="0"><span class="lb"><svg class="ic" viewBox="0 0 24 24"><path d="${ic[k]}"/></svg>${v[0]}</span>${k==='dashboard'&&lowN()?`<span class="badge">${lowN()}</span>`:''}</a>`).join('')}
 <div class="who">${esc(me.name)} (${me.role})<br><a data-p="out" style="padding:0;color:var(--acc)">Sign out</a></div></nav>
 <main><div class="pr prh">${logoHtml()}<div><b>${esc(D.company.name||'Inventory System')}</b><br>${esc(D.company.address||'')}</div></div>${pages[page][1]()}</main></div>`;
 document.querySelectorAll('nav a').forEach(a=>{a.onclick=()=>{if(a.dataset.p==='out'){me=null;store.set('session',null);authMode='profile'}else page=a.dataset.p;render()};a.onkeydown=e=>{if(e.key==='Enter')a.click()}});
 bind();
}
function renderAuth(){if(authMode==='code')return renderCode();
 const up=authMode==='up',adm=D.users.some(u=>u.role==='admin');
 $('#root').innerHTML=`<div class="auth"><div class="hero"><span class="logo">IS</span><h2>${esc(D.company.name||'Inventory Management System')}</h2><p>Track stock, sales and damaged goods in one place.</p><ul class="feat"><li>${chk}Record stock in, stock out and sales</li><li>${chk}Track damaged stock and low-stock alerts</li><li>${chk}Print clear reports for any period</li></ul></div><form id="af"><div class="fh">${logoHtml()}</div><div><h1>${up?'Create your account':'Welcome back'}</h1><p class="sub">${up?'Register to start managing stock.':'Sign in to continue to your dashboard.'}</p></div>
 ${up?'<div><label for="nm">Full name</label><input id="nm" required></div>':''}
 <div><label for="rl">${up?'Account type':'Sign in as'}</label><select id="rl"><option value="staff">Staff</option><option value="admin" ${up&&adm?'disabled':''} ${up&&!adm?'selected':''}>Administrator${up&&adm?' (already taken)':''}</option></select></div>
 <div><label for="em">Email</label><input id="em" type="email" required></div>
 <div><label for="pw">Password</label><input id="pw" type="password" minlength="8" required><label class="ck" style="margin-top:8px;font-size:13px;color:var(--mute)"><input type="checkbox" id="sp"> Show password</label></div>
 <div class="err" id="er"></div><button class="btn wide">${up?'Create account':'Sign in'}</button>
 <a id="sw" style="color:var(--acc);cursor:pointer;font-size:14px">${up?'Already have an account? Sign in':'New here? Create an account'}</a>
 <a id="bk" style="color:var(--mute);cursor:pointer;font-size:14px">Back to company page</a>
 ${up?'<span style="font-size:13px;color:var(--mute)">Only one administrator account is allowed. All other accounts are staff.</span>':''}</form></div>`;
 fixIn(document);$('#em').oninput=()=>{const a=D.users.find(u=>u.email===$('#em').value.trim().toLowerCase());if(a&&!up)$('#rl').value=a.role};$('#sp').onchange=e=>{$('#pw').type=e.target.checked?'text':'password'};$('#sw').onclick=()=>{authMode=up?'in':'up';render()};$('#bk').onclick=()=>{authMode='profile';render()};
 $('#af').onsubmit=async e=>{e.preventDefault();const em=$('#em').value.trim().toLowerCase(),h=await hash($('#pw').value);
  if(up){if($('#rl').value==='admin'&&adm)return $('#er').textContent='An administrator already exists. Only one administrator is allowed. Create a staff account instead.';if(D.users.some(u=>u.email===em))return $('#er').textContent='An account with this email already exists. Sign in instead.';
   if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test($('#pw').value))return $('#er').textContent='Use at least 8 characters with letters and numbers.';
   const u={id:uid(),name:$('#nm').value.trim(),email:em,pass:h,role:$('#rl').value};D.users.push(u);save();startMfa(u)}

 if($('#df'))$('#df').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),qty=+f.qty;
  if(qty>stock(f.itemId)){$('#dme').textContent='Only '+stock(f.itemId)+' valid units of this item are in stock. Enter a smaller quantity.';return}
  D.txs.push({id:uid(),date:f.date,itemId:f.itemId,type:'out',qty,note:f.note,user:me.name,reason:'damaged',price:item(f.itemId).price});save();render()};
 g('[data-sp]').forEach(b=>b.onclick=()=>{salesSel=b.dataset.sp;render()});
 if($('#sdf')){$('#sdf').onchange=e=>{sFrom=e.target.value;render()};$('#sdt').onchange=e=>{sTo=e.target.value;render()};g('[data-sr]').forEach(b=>b.onclick=()=>{sTo=today();sFrom=b.dataset.sr==='day'?today():today().slice(0,8)+'01';render()})}
 g('[data-tx]').forEach(b=>b.onclick=()=>txDlg(D.txs.find(t=>t.id===b.dataset.tx)));
 g('[data-pick]').forEach(b=>b.onclick=()=>{selItem=b.dataset.pick;render()});
 if($('#cf')){$('#cf').onchange=e=>{cat=e.target.value;render()};$('#stf').onchange=e=>{stf=e.target.value;render()}}
 if($('#sf'))$('#sf').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));f.phone=toIntl(f.phone);D.sups.push({id:uid(),...f});save();render()};
 if($('#tf'))$('#tf').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),qty=+f.qty;
  if(f.type==='out'&&qty>stock(f.itemId)){$('#te').textContent='Only '+stock(f.itemId)+' of this item is in stock. Enter a smaller quantity.';return}
  D.txs.push({id:uid(),date:f.date,itemId:f.itemId,type:f.type,qty,note:f.note,user:me.name,reason:f.type==='out'?f.reason:undefined,price:item(f.itemId).price});save();render()};
 g('[data-ri]').forEach(c=>c.onchange=()=>{const id=c.dataset.ri;repOff=c.checked?repOff.filter(x=>x!==id):[...repOff,id];render()});
 g('[data-ra]').forEach(b=>b.onclick=()=>{repOff=b.dataset.ra==='all'?[]:D.items.map(i=>i.id);render()});
 if($('#rf')){$('#rf').onchange=e=>{rf=e.target.value;render()};$('#rt').onchange=e=>{rt=e.target.value;render()};
  g('[data-r]').forEach(b=>b.onclick=()=>{rt=today();rf=b.dataset.r==='day'?today():today().slice(0,8)+'01';render()})}
}
let lastAct=Date.now();['click','keydown','mousemove','touchstart'].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now()}));
setInterval(()=>{if(me&&Date.now()-lastAct>1800000){me=null;store.set('session',null);authMode='in';render();alert('You were signed out after 30 minutes of inactivity. Please sign in again.')}},30000);
render();
</script>
</body>
</html>
